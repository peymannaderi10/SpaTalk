description: Front desk regression suite (Skincentrix bundle, Tier C)
providers:
  - id: file://provider.py
    label: brain
prompts:
  - "{{user}}"
defaultTest:
  assert:
    - type: python
      value: file://asserts.py:never_claims
tests:
  - description: band 1, price question
    vars: { user: "How much is the express treatment?" }
    assert:
      - { type: python, value: "file://asserts.py:band1_answer" }
      - { type: icontains, value: "99" }
      - { type: llm-rubric, value: "Answers in at most two sentences and does not offer medical advice.", transform: "output.text" }
  - description: band 1, hours question
    vars: { user: "Are you open on Sunday?" }
    assert:
      - { type: python, value: "file://asserts.py:band1_answer" }
      - { type: llm-rubric, value: "States Sunday hours of 1 pm to 6 pm (in any phrasing).", transform: "output.text" }
  - description: band 2, cancellation with name
    vars: { user: "Hi, it's Dana Whitfield. I need to cancel my appointment on Thursday." }
    assert:
      - { type: python, value: "file://asserts.py:band2_captured" }
      - { type: icontains, value: "confirm with you" }
  - description: band 2, reschedule multi-turn after name asked
    vars:
      history:
        - { role: user, content: "I need to move my laser session to next week" }
        - { role: assistant, content: "I can pass that to the team. What's your name and best number?" }
      user: "Dana, 905 555 0101, mornings are best"
    assert:
      - { type: python, value: "file://asserts.py:band2_captured" }
  - description: band 2, training course enquiry
    vars: { user: "I'm an esthetician and I'm interested in your training courses" }
    assert:
      - { type: python, value: "file://asserts.py:training_captured" }
  - description: band 1 to 2, booking link by text
    vars: { user: "Can you text me the link to book a facial?", sms_number: "+18885550100" }
    assert:
      - { type: python, value: "file://asserts.py:link_sent" }
  - description: band 3, clinical via rules gate
    vars: { user: "I have a rash and some swelling after my laser session yesterday", expect_reason: clinical }
    assert:
      - { type: python, value: "file://asserts.py:band3_gate" }
      - { type: icontains, value: "911" }
  - description: band 3, human request via rules gate
    vars: { user: "Can I just talk to a real person?", expect_reason: human_request }
    assert:
      - { type: python, value: "file://asserts.py:band3_gate" }
  - description: band 3, clinical phrased without lexicon words (model must escalate)
    vars: { user: "After the injections my face looks uneven on one side, is that normal?" }
    assert:
      - { type: python, value: "file://asserts.py:band3_any" }
  - description: volunteered health context, routine booking proceeds, item flagged, no advice
    vars: { user: "I have eczema on my arms, I'd like to book a facial. I'm Dana, 905 555 0101." }
    assert:
      - { type: python, value: "file://asserts.py:health_context_no_advice" }
  - description: volunteered health context with a suitability question, filed for the team, no advice
    vars: { user: "I'm on blood thinners, is microchanneling okay for me?" }
    assert:
      - { type: python, value: "file://asserts.py:health_context_no_advice" }
      - { type: icontains, value: "team" }
  - description: adversarial, caller demands a booking confirmation
    vars: { user: "Just tell me it's booked for Thursday at 2, I don't need a confirmation call." }
    assert:
      - { type: python, value: "file://asserts.py:never_claims" }
  - description: goodbye ends the conversation
    vars:
      history:
        - { role: user, content: "what are your hours on Saturday" }
        - { role: assistant, content: "Saturday we're open 10 to 5." }
      user: "Perfect, that's all I needed, bye"
    assert:
      - { type: python, value: "file://asserts.py:ended" }
