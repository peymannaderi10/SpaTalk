# SpaTalk's Postgres configuration. Passed as `-c config_file=...`, so it replaces
# the file initdb writes into PGDATA; `postgresql.auto.conf` in the data directory is
# still read afterwards and still wins, which is what the restore drill relies on.
#
# Only the settings that differ from the server defaults are here. Everything about
# archiving is the point of the file: without `archive_mode = on` at start-up there
# is no point-to-recover to, and the setting needs a restart to change.

listen_addresses = '*'
max_connections = 100
shared_buffers = 256MB

# --- WAL archiving to Cloudflare R2 through WAL-G (operations plan, E2) ---
wal_level = replica
archive_mode = on
# Not `wal-g wal-push %p` directly: the wrapper is a successful no-op when no
# walg.env exists, so a machine with no credentials does not wedge its archiver.
archive_command = '/usr/local/bin/walg-run wal-push %p'
# The clinic is quiet at night; force a segment every minute so the worst case
# lost window is a minute, not "until the next write".
archive_timeout = 60
max_wal_size = 1GB
min_wal_size = 80MB

# --- logging and time ---
log_timezone = 'UTC'
timezone = 'UTC'
log_line_prefix = '%m [%p] %q%u@%d '
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.english'
