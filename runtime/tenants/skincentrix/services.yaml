  - id: virtual_consultation
    name: Free virtual consultation
    category: consultation
    price_text: free
    duration_minutes: 15
    booking_url: https://skincentrix.janeapp.com/locations/skincentrix
    description: Phone, video, FaceTime or WhatsApp. The usual first step for new clients.
  - id: skin_assessment
    name: In-person skin assessment
    category: consultation
    price_text: ask the team
    duration_minutes: 30
    booking_url: https://skincentrix.janeapp.com/locations/skincentrix
    description: Skin analysis with the clinic's imaging technology, then a plan.

  # --- what callers ask for by category (generic entries; the specific ones follow) ---
  - id: facial
