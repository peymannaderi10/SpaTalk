    category: facial
    price_text: "from $125 for the Classic to $295 for the advanced facials"
    duration_minutes: 60
    booking_url: https://skincentrix.janeapp.com/locations/skincentrix
    description: Ask which facial they have in mind; the Classic is $125, Hydrabrasion and HydrationFIX $215, MesoJet, Mirapeel, PureCarbon and Lift and Sculpt $295.
  - id: express_treatment
