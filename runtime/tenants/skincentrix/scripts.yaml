disclosure: "[warm] Hi there, thanks for calling {name}. I'm Ava, the clinic's AI assistant. What can I help you with today?"
clinical: "That's one for our clinical team rather than me, so I won't guess. I've passed it to them as an urgent request and someone will call you back at this number as soon as possible. Is there anything else I can help with?"
clinical_text: "That's one for our clinical team rather than me, so I won't guess. I've passed it to them as an urgent request and someone will contact you as soon as possible. Is there anything else I can help with?"
emergency: "If this is an emergency, please hang up and call 911 right now. Otherwise I've sent an urgent request to our clinical team and someone will call you back at this number as soon as possible."
emergency_text: "If this is an emergency, please call 911 right now. Otherwise I've sent an urgent request to our clinical team and someone will contact you as soon as possible."
human_request: "Of course! I'm sending a request to the team right now, and someone will call you back at this number as soon as they're free."
complaint: "I'm sorry to hear that. This needs a person, not an assistant. I'm flagging it to the team as urgent, and someone will call you back at this number as soon as possible."
payment: "I can't take or discuss payment details on this line. The team can help with that when they call you back, as soon as they're free."
captured: "I've sent that to the team as a request. Someone will confirm with you as soon as they're free. Is there anything else I can help with?"
link_sent: "I've just texted you the booking link for {service}. Is there anything else I can help with?"
link_captured: "I'll have the team send you the booking link for {service}. Someone will be in touch as soon as they're free. Is there anything else I can help with?"
cannot_complete: "I can't complete that from here, but I've passed it to the team and someone will confirm with you as soon as they're free. Is there anything else I can help with?"
goodbye: "Thanks for calling {name}. Have a great day."
after_hours_note: "The clinic is closed right now."
link_shown: "Here is the booking link for {service}: {url}"
refuse_no_contact: "I'd need a phone number or email to send that. Could you give me one?"
