disclosure: "Hi there, thanks for calling {name}! I'm Ava, the clinic's AI assistant. I can tell you all about our treatments, prices and hours, or pass a message straight to the team. What can I help you with today?"
clinical: "That's a question for our clinical team, and I don't want to guess. I'm sending them an urgent request right now, and someone will call you back at this number {confirm_by}. If this is an emergency, please hang up and call 911."
clinical_text: "That's a question for our clinical team, and I don't want to guess. I've sent them an urgent request, and someone will contact you {confirm_by}. If this is an emergency, please call 911 now."
human_request: "Of course! I'm sending a request to the team right now, and someone will call you back at this number {confirm_by}."
complaint: "I'm sorry to hear that. This needs a person, not an assistant. I'm flagging it to the team as urgent, and someone will call you back at this number {confirm_by}."
payment: "I can't take or discuss payment details on this line. The team can help with that when they call you back {confirm_by}."
captured: "I've sent that to the team as a request. Someone will confirm with you {confirm_by}."
link_sent: "I've just texted you the booking link for {service}. Is there anything else I can help with?"
link_captured: "I'll have the team send you the booking link for {service}. Someone will be in touch {confirm_by}."
cannot_complete: "I can't complete that from here, but I've passed it to the team and someone will confirm with you {confirm_by}."
goodbye: "Thanks for calling {name}. Have a great day."
after_hours_note: "The clinic is closed right now."
link_shown: "Here is the booking link for {service}: {url}"
refuse_no_contact: "I'd need a phone number or email to send that. Could you give me one?"
refuse_unknown_service: "I don't have that treatment on the list. Could you tell me a bit more about what you're looking for?"
refuse_out_of_scope: "That's not something I can help with from here. The clinic can, at {phone} during opening hours."
refuse_unavailable: "I'm having trouble saving that right now, so please don't count on me for it. Please call the clinic directly at {phone}."
followup: "Just checking in from Skincentrix: still want a hand with that? Reply here anytime, or book online: {booking_url}"
missed_call_text: "Hi, this is Skincentrix's assistant. You just called us. Reply here and I can help, or book online: {booking_url}"
offline_reply: "Thanks for texting Skincentrix. We'll reply shortly. To book now: {booking_url}"
chat_greeting: "Hi there! I'm Ava, {name}'s AI assistant. Ask me about our treatments, prices or hours, or I can pass a request to the team. What can I help you with?"
optout_confirm: "You've been unsubscribed from Skincentrix texts. Reply START to opt back in."
help_text: "Skincentrix: reply with your question and the assistant will help, or call {phone}. Reply STOP to unsubscribe."
takeover_notice: "A member of the Skincentrix team has joined this conversation."
comment_public_reply: "Thanks! Check your DMs."
dm_greeting: "Hi, this is Skincentrix's assistant."
loop_guard: "This line is answered by the clinic's assistant and cannot transfer to itself. Please call back from another number."
failover: "We can't take your call right now. Please text us at {sms_number} or book online at {booking_url}."
transferring: "One moment, I'll connect you to the team."
sms_paused: "Thanks for texting {name}. The assistant is paused right now. A member of the team will read your message, or you can call {phone}."
