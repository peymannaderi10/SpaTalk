id: skincentrix
name: Skincentrix
public_phone: "905-703-7546"
timezone: America/Toronto
jurisdiction: CA-ON
integration_tier: C
fulfilment: tier_c
retention_days: 30
recording_enabled: false
# Hours from skincentrix.com/contact-us on 2026-09-03.
hours:
  mon: []
  tue: [["10:00", "18:00"]]
  wed: [["10:00", "20:00"]]
  thu: [["12:00", "20:00"]]
  fri: [["10:00", "19:00"]]
  sat: [["10:00", "18:00"]]
  sun: [["10:00", "18:00"]]
holidays: []
voice_numbers: []          # filled by `spatalk numbers add` after Telnyx purchase
sms_from_number: "+12899170079"   # the tenant messaging number staff texts come from (S1)
transfer_number: null      # UNVERIFIED: a TELUS extension that does not forward to us
booking_url_default: https://skincentrix.janeapp.com/locations/skincentrix
# SMS flood guard (plan F): the defaults, written out so the clinic can see and change them.
sms_guard:
  burst_limit: 12
  burst_window_minutes: 10
  daily_limit: 40
  mute_hours: 24
  tenant_daily_replies: 400
social:
  comment_mode: keyword
  comment_keywords: ["price", "how much", "book", "info", "details"]
  public_reply_enabled: false
persona:
  # "Ava" is a placeholder the founder can rename; the disclosure still says AI.
  assistant_name: Ava
  tone: >-
    warm, upbeat and genuinely friendly, like the best front-desk person the clinic ever had:
    conversational, uses contractions, sounds happy to help, knows the treatments well and
    enjoys talking about them, never clinical, never salesy, never robotic
  max_sentences_per_turn: 3
# The people a caller may ask for by name (lead context plan, L1). Names and roles from
# skincentrix.com and knowledge.md; this list, plus "any", is the whole of what the model
# may return for `practitioner`. `concerns` is left to the schema default.
team:
  - name: Sabah Shaikh
    role: founder and aesthetician, leads the facial and skin programs
  - name: Amanda Coutts
    role: clinical manager and medical aesthetician
  - name: Faisal Rohile
    role: BScN RN, master injector
  - name: Anne Perez
    role: RPN, injectables and PRP
  - name: Ruru Ahlam
    role: aesthetician
  - name: Helen Courbetis
    role: aesthetician
  - name: Alexandra Debski
    role: aesthetician
  - name: Sanober Ijaz
    role: aesthetician
  - name: Mariam Khaizaran
    role: aesthetician
  - name: Hala Saeed
    role: aesthetician
  - name: Emma Walker
    role: aesthetician
escalation:
  owner_name: Skincentrix front desk
  owner_email: info@skincentrix.com
  owner_phone: null
  urgent_minutes: 15
  standard_business_hours: 3
  after_hours_clinical_contact: null   # UNVERIFIED: ask the clinic
delivery:
  destinations:
    - kind: email
      address: info@skincentrix.com
    - kind: slack
      webhook_env: SKINCENTRIX_SLACK_WEBHOOK
      channel_id: null       # Slack channel id; set with SLACK_BOT_TOKEN for takeover threads
    - kind: whatsapp
      address_env: SKINCENTRIX_WHATSAPP_STAFF   # env var NAME; the staff E.164 never lands here
    # The founder's own mobile, named not written (S1). Ordinary SMS from the number above.
    - kind: sms
      address_env: SKINCENTRIX_STAFF_SMS
  digest_time_local: "07:30"
  staff_phone_numbers: []
