[project]
name = "spatalk"
version = "0.1.0"
description = "Multi-channel AI front desk runtime"
requires-python = ">=3.12"
dependencies = [
    "rapidfuzz>=3.9",
    "metaphone>=0.6",
  "pipecat-ai[websocket,silero,local-smart-turn,soniox,inworld,google,openai,runner]>=1.8.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "itsdangerous>=2.2",
  "cryptography>=42",   # Telnyx Ed25519 webhook signatures (Task B2)
  "httpx>=0.27",
  "aiosmtplib>=3.0",
  "slack-sdk>=3.27",
  "google-genai>=1.0",
  "openai>=1.99",   # second LLM vendor: LLM_MODEL=openai:<model> (operations plan, Task E6)
  "typer>=0.12",
  "loguru>=0.7",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "pytest-httpx>=0.30"]

[project.scripts]
spatalk = "spatalk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spatalk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pin the rule set ruff shipped as its default when this plan was written; newer ruff
# releases enable far more rules by default and the selection must not drift per machine.
select = ["E4", "E7", "E9", "F"]
